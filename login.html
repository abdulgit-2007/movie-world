<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Movie World - Login</title>

    <style>

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111;
            color: white;

            font-family: Arial;
        }

        .login-box {

            background: #222;

            width: 320px;

            padding: 30px;

            border-radius: 12px;

            text-align: center;

            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h1 {
            margin-bottom: 25px;
        }

        input {

            width: 90%;

            padding: 12px;

            margin-bottom: 15px;

            border: none;

            border-radius: 6px;

            outline: none;

            font-size: 16px;
        }

        button {

            width: 98%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #007bff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #0056b3;
        }

        #error {

            color: red;

            margin-top: 15px;
        }

    </style>

</head>


<body>


    <div class="login-box">

        <h1>🎬 Movie World</h1>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button onclick="login()">
            Enter
        </button>

        <p id="error"></p>

    </div>


    <script>

        function login() {

            const password =
                document.getElementById("password").value;


            // CHANGE YOUR PASSWORD HERE

            const correctPassword =
                "hub@234";


            if (password === correctPassword) {

                localStorage.setItem(
                    "movieWorldAccess",
                    "true"
                );


                window.location.href =
                    "home.html";

            }

            else {

                document.getElementById("error")
                    .textContent =
                    "Wrong password!";

            }

        }

    </script>


</body>

</html>
